# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: document-intake
metadata:
  template: document-intake@1.0.0

services:
  functions:
    project: ./src/DocumentIntake.Functions
    language: dotnet
    host: function

hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/register-providers.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: pwsh ./scripts/register-providers.ps1
      interactive: false
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/register-analyzers.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: pwsh ./scripts/register-analyzers.ps1
      interactive: false
      continueOnError: false
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/register-event-subscription.ps1
      interactive: false
      continueOnError: true
    posix:
      shell: sh
      run: pwsh ./scripts/register-event-subscription.ps1
      interactive: false
      continueOnError: true
